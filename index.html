<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한바퀴 코스</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* 지도 전체 화면 + 아래(폰) / 왼쪽(PC) 조작판, 달리기 중엔 위쪽 계기판 */
:root{
  --bg:#f3f6f4; --panel:#ffffff; --fg:#17201b; --muted:#5d6b63; --line:#dfe6e1;
  --accent:#0f8a5f; --accent-fg:#ffffff; --warn:#c92a2a; --ok:#0f8a5f; --okbg:#e3f5ec; --warnbg:#fdecec;
  --c1:#0f8a5f; --c2:#d9480f; --c3:#3b5bdb;
  --display:"Space Grotesk","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1512; --panel:#18211c; --fg:#e6eee9; --muted:#9aaba1; --line:#2a362f;
  --accent:#2fbf86; --accent-fg:#06110b; --warn:#ff6b6b; --ok:#2fbf86; --okbg:#173327; --warnbg:#3a1d1d; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#mapWrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0}
#panel{background:var(--panel);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
@media (min-width:820px){
  #app{flex-direction:row-reverse}
  #panel{width:380px;max-height:none;border-top:0;border-right:1px solid var(--line);padding-top:14px}
  #grab{display:none}
}
#grab{align-self:center;width:100%;border:0;background:transparent;padding:2px 0 4px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line)}
.collapsed .controls{display:none}
.running .controls,.running .results,.running #grab{display:none}
h1{font-family:var(--display);font-size:19px;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;
  padding:6px 12px;font:600 14px var(--display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input[type=number],input[type=text]{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--fg);font:600 14px var(--display)}
label.check{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:10px 14px;font:700 15px var(--body);cursor:pointer;background:transparent;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{border:1px solid var(--line)}
.btn.small{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
.grow{flex:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{font-size:13px;color:var(--muted);min-height:1.2em;line-height:1.45}
#status.err{color:var(--warn)}
.results{display:flex;flex-direction:column;gap:8px}
#cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cand{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;
  background:transparent;color:var(--fg);text-align:left;font:inherit;min-width:0}
.cand[aria-pressed="true"]{border-color:var(--fg)}
.cand .top{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cand b{font:700 17px var(--display);font-variant-numeric:tabular-nums}
.cand .sub{font-size:11px;color:var(--muted);line-height:1.35}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;width:fit-content}
.badge.ok{background:var(--okbg);color:var(--ok)}
#detail{font-size:13px;color:var(--muted);line-height:1.5}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
/* 달리기 계기판 */
#hud{position:absolute;z-index:1000;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--panel);color:var(--fg);border-radius:14px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
#hud .big{font:700 34px var(--display);font-variant-numeric:tabular-nums;line-height:1}
#hud .big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
#hud .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-variant-numeric:tabular-nums}
#hud .stats div{display:flex;flex-direction:column;min-width:0}
#hud .stats span{font-size:11px;color:var(--muted)}
#hud .stats strong{font:700 16px var(--display)}
#hudMsg{font-size:13px;font-weight:700}
#hudMsg.off{color:var(--warn)}
#hudMsg.on{color:var(--ok)}
#drawBar{position:absolute;z-index:1000;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--panel);color:var(--fg);border-radius:14px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45}
#drawTxt b{font:700 16px var(--display)}
.mychip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mychip button{border:0;background:transparent;color:var(--fg);font:600 13px var(--body);padding:6px 10px;cursor:pointer}
.mychip button.x{color:var(--muted);padding:6px 9px;border-left:1px solid var(--line)}
#followBtn{position:absolute;z-index:1000;right:max(10px,env(safe-area-inset-right,0px));bottom:16px}
.arrow{color:#fff;font-size:12px;line-height:12px;text-shadow:0 0 2px #000,0 0 2px #000}
.me{width:16px;height:16px;border-radius:50%;background:#1c7ed6;border:3px solid #fff;box-shadow:0 0 0 2px rgba(28,126,214,.35)}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <div id="map" aria-label="지도"></div>
    <div id="hud" hidden>
      <div class="row" style="justify-content:space-between">
        <div class="big" id="hudRemain">0.00<small>km 남음</small></div>
        <button class="btn ghost small" id="stopBtn" type="button">■ 그만</button>
      </div>
      <div class="stats">
        <div><span>바퀴</span><strong id="hudLap">-</strong></div>
        <div><span>달린 거리</span><strong id="hudDone">0.00</strong></div>
        <div><span>시간</span><strong id="hudTime">0:00</strong></div>
        <div><span>평균 페이스</span><strong id="hudPace">-</strong></div>
      </div>
      <div id="hudMsg">위치 찾는 중…</div>
    </div>
    <button class="btn primary small" id="followBtn" type="button" hidden>◎ 내 위치 따라가기</button>
    <div id="drawBar" hidden>
      <div id="drawTxt">달릴 길을 따라 지도를 차례로 눌러 주세요. 마지막 점은 첫 점과 자동으로 이어져요.</div>
      <div class="row">
        <button class="btn ghost small" id="drawUndo" type="button">↶ 되돌리기</button>
        <button class="btn ghost small" id="drawCancel" type="button">취소</button>
        <button class="btn primary small grow" id="drawDone" type="button">완성</button>
      </div>
    </div>
  </div>

  <div id="panel">
    <button id="grab" type="button" aria-expanded="true" aria-controls="controls"><span id="grabTxt">설정 접기</span></button>
    <h1>한바퀴 코스<small>찻길 안 건너는 단지 안 코스</small></h1>

    <div class="controls" id="controls">
      <div class="row">
        <button class="btn ghost small" id="locBtn" type="button">📍 내 위치</button>
        <span class="hint">또는 지도를 눌러 출발점을 정하세요</span>
      </div>
      <div class="row" id="distChips">
        <span class="label">거리</span>
        <button class="chip" type="button" data-km="2">2</button>
        <button class="chip" type="button" data-km="3">3</button>
        <button class="chip" type="button" data-km="5">5</button>
        <button class="chip" type="button" data-km="7">7</button>
        <input type="number" id="kmInput" min="0.5" max="21" step="0.5" value="3" aria-label="거리 직접 입력(km)"> km
      </div>
      <div class="row">
        <span class="label">페이스</span>
        <input type="text" id="paceInput" value="6:00" aria-label="페이스(분:초 / km)"> /km
        <span class="label">최대</span>
        <input type="number" id="lapMax" min="1" max="20" step="1" value="5" aria-label="최대 바퀴 수"> 바퀴
      </div>
      <label class="check"><input type="checkbox" id="prefBig" checked> 큰길 옆 보도도 피하기 (단지 안쪽 길 우선)</label>
      <div class="row">
        <button class="btn primary grow" id="goBtn" type="button">코스 찾기</button>
        <button class="btn ghost" id="drawBtn" type="button">✏️ 직접 그리기</button>
      </div>
      <div class="row" id="myList" hidden></div>
    </div>

    <div id="status"></div>

    <div class="results" id="results" hidden>
      <div id="cands"></div>
      <div id="detail"></div>
      <div class="row">
        <button class="btn ghost small" id="revBtn" type="button">⇄ 방향 바꾸기</button>
        <button class="btn ghost small" id="gpxBtn" type="button">GPX 저장</button>
        <button class="btn primary small grow" id="runBtn" type="button">▶ 달리기 시작</button>
      </div>
    </div>
    <p class="hint">찻길(일반 도로)과 횡단보도는 아예 빼고, 단지 안 도로·산책로·보행로만으로 코스를 만들어요. 길 정보는 OpenStreetMap이라 실제와 다를 수 있으니 처음 가는 코스는 직접 확인하세요.</p>
  </div>
</div>

<script>
'use strict';
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLORS = ['--c1', '--c2', '--c3'].map(css);
const D2R = Math.PI / 180;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  keys() { try { return Object.keys(localStorage); } catch { return []; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
// 예전 버전이 저장한 데이터 정리
store.keys().filter(k => k.startsWith('rc:t1:') || k.startsWith('rc:t2:')).forEach(store.del);

// ---------- 평면 좌표 (출발점 기준 미터) ----------
let P0 = null;
function setProj(lat, lon) { P0 = { lat, lon, kx: 111320 * Math.cos(lat * D2R), ky: 110540 }; }
const xy = (lat, lon) => [(lon - P0.lon) * P0.kx, (lat - P0.lat) * P0.ky];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

// ---------- 지도 ----------
const saved = store.get('rc:settings', {});
let start = saved.start || [37.5283, 126.9326];
const map = L.map('map', { zoomControl: true }).setView(start, 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const startMarker = L.marker(start, { draggable: true, title: '출발점' }).addTo(map)
  .bindTooltip('출발', { permanent: true, direction: 'top', offset: [-15, -12] });
function setStart(p, pan) { start = p; startMarker.setLatLng(p); if (pan) map.setView(p, 16); saveSettings(); schedulePrefetch(); }
startMarker.on('dragend', e => { const p = e.target.getLatLng(); setStart([p.lat, p.lng]); });
map.on('click', e => { if (drawing) addDrawPoint([e.latlng.lat, e.latlng.lng]); else if (!run) setStart([e.latlng.lat, e.latlng.lng]); });
let drawing = null;

const status = (msg, err) => { $('status').textContent = msg; $('status').className = err ? 'err' : ''; };

// ---------- 설정 ----------
function setKm(v) {
  $('kmInput').value = v;
  document.querySelectorAll('#distChips .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.km === String(v)));
}
document.querySelectorAll('#distChips .chip').forEach(b => b.onclick = () => { setKm(b.dataset.km); saveSettings(); schedulePrefetch(); replan(); });
function replan() { // 거리·바퀴 설정이 바뀌면 다시 계산
  if (run || !cands.length) return;
  if (cands[0].type === '직접') { const c = cands[0], rev = c.rev; cands = [drawnCand(c.pts, c.name)]; cands[0].rev = rev; draw(); }
  else if (all.length) { lastD = parseFloat($('kmInput').value) * 1000 || lastD; pickCands(); draw(); }
}
$('kmInput').oninput = () => { setKm($('kmInput').value); saveSettings(); schedulePrefetch(); replan(); };
['paceInput', 'lapMax'].forEach(id => $(id).onchange = () => { saveSettings(); replan(); });
$('prefBig').onchange = saveSettings;
function saveSettings() {
  store.set('rc:settings', { start, km: $('kmInput').value, pace: $('paceInput').value, lapMax: $('lapMax').value, big: $('prefBig').checked });
}
setKm(saved.km || '3');
if (saved.pace) $('paceInput').value = saved.pace;
if (saved.lapMax) $('lapMax').value = saved.lapMax;
if (saved.big === false) $('prefBig').checked = false;
function parsePace() { const m = /^(\d{1,2}):(\d{2})$/.exec($('paceInput').value.trim()); return m ? +m[1] + +m[2] / 60 : 6; }
function fmtMin(min) { const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h}시간 ${m}분` : `${m}분`; }
const km = m => (m / 1000).toFixed(2);

function setCollapsed(c) {
  $('panel').classList.toggle('collapsed', c);
  $('grab').setAttribute('aria-expanded', !c);
  $('grabTxt').textContent = c ? '설정 펼치기' : '설정 접기';
  refit();
}
$('grab').onclick = () => setCollapsed(!$('panel').classList.contains('collapsed'));
function refit() {
  setTimeout(() => { map.invalidateSize(); const c = cands[selected]; if (!run && c) map.fitBounds(L.latLngBounds(c.lapLL.concat(c.stemLL)), { padding: [40, 40] }); }, 250);
}

$('locBtn').onclick = () => {
  if (!navigator.geolocation) return status('이 브라우저는 위치를 지원하지 않아요. 지도를 눌러 주세요.', true);
  status('위치 찾는 중…');
  navigator.geolocation.getCurrentPosition(
    p => { setStart([p.coords.latitude, p.coords.longitude], true); status('내 위치를 출발점으로 정했어요.'); },
    e => status('위치를 못 가져왔어요(' + e.message + '). 지도를 눌러 출발점을 정하세요.', true),
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

// ---------- OSM 길 데이터 (구역별로 휴대폰에 저장) ----------
const TY = 0.01, TX = 0.0125, TILE_TTL = 30 * 864e5, TILE_VER = 'rc:t3:';
const SAFE_HW = /^(footway|path|pedestrian|service|living_street|track|cycleway|corridor|bridleway)$/;
const PUBLIC_HW = /^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|road|busway)(_link)?$/;
const BIG_HW = /^(motorway|trunk|primary|secondary|tertiary)(_link)?$/;
function classify(t) {
  const hw = t.highway; if (!hw) return null;
  if (t.footway === 'crossing' || t.cycleway === 'crossing' || t.path === 'crossing' || (t.crossing && t.crossing !== 'no')) return 'cross';
  const priv = /^(private|no|destination|customers)$/.test(t.access || '') || /^(private|no|destination)$/.test(t.motor_vehicle || t.motorcar || '');
  if ((hw === 'residential' || hw === 'unclassified') && priv) return 'safe'; // 단지 안 사설 도로
  if (SAFE_HW.test(hw)) return t.access === 'no' && hw !== 'footway' ? null : 'safe';
  if (PUBLIC_HW.test(hw)) return BIG_HW.test(hw) ? 'big' : 'public';
  return null; // 계단, 공사 중 등은 안 씀
}
const tileKey = (ty, tx) => TILE_VER + ty + ':' + tx;
function tilesFor(bb) {
  const out = [];
  for (let ty = Math.floor(bb[0] / TY); ty <= Math.floor(bb[2] / TY); ty++)
    for (let tx = Math.floor(bb[1] / TX); tx <= Math.floor(bb[3] / TX); tx++) out.push([ty, tx]);
  return out;
}
function areaHalf(Dm) { return Math.min(1300, Math.max(700, Dm / 8 + 400)); }
function areaBB(s, Dm) {
  const h = areaHalf(Dm), kx = 111320 * Math.cos(s[0] * D2R);
  return [s[0] - h / 110540, s[1] - h / kx, s[0] + h / 110540, s[1] + h / kx];
}
async function overpass(q) {
  let lastErr;
  for (let round = 0; round < 2; round++) {
    for (const url of OVERPASS) {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 70000);
      try {
        const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl.signal });
        if (!res.ok) throw new Error('응답 ' + res.status);
        const j = await res.json();
        if (j.remark && /runtime error|timed out/i.test(j.remark)) throw new Error(j.remark);
        return j;
      } catch (e) { lastErr = e.name === 'AbortError' ? new Error('응답 없음') : e; } finally { clearTimeout(tm); }
    }
    await sleep(3000);
  }
  throw lastErr || new Error('지도 데이터 서버 연결 실패');
}
function joinRings(parts) { // 여러 조각으로 나뉜 경계선을 고리로 이음
  const rings = [], left = parts.filter(p => p.length > 1).map(p => p.slice());
  const same = (a, b) => a[0] === b[0] && a[1] === b[1];
  while (left.length) {
    let ring = left.shift();
    for (let guard = 0; guard < 500 && !same(ring[0], ring[ring.length - 1]); guard++) {
      const end = ring[ring.length - 1];
      const i = left.findIndex(p => same(p[0], end) || same(p[p.length - 1], end));
      if (i < 0) break;
      const p = left.splice(i, 1)[0];
      ring = ring.concat((same(p[0], end) ? p : p.slice().reverse()).slice(1));
    }
    if (ring.length >= 4) rings.push(ring);
  }
  return rings;
}
function parseOverpass(j) {
  const r6 = v => Math.round(v * 1e6) / 1e6, ways = [], cr = [], polys = [];
  const geo = g => g.filter(Boolean).map(p => [r6(p.lat), r6(p.lon)]);
  for (const e of j.elements) {
    if (e.type === 'node') { cr.push({ id: e.id, lat: r6(e.lat), lon: r6(e.lon) }); continue; }
    const t = e.tags || {};
    if (t.landuse || t.amenity) { // 아파트 단지·학교 구역
      if (e.type === 'way' && e.geometry) polys.push({ id: 'w' + e.id, rings: [geo(e.geometry)] });
      if (e.type === 'relation' && e.members) polys.push({ id: 'r' + e.id, rings: joinRings(e.members.filter(m => m.type === 'way' && m.role !== 'inner' && m.geometry).map(m => geo(m.geometry))) });
      if (!t.highway) continue;
    }
    if (e.type !== 'way' || !e.geometry || !e.nodes || e.geometry.length < 2 || e.geometry.some(p => !p)) continue;

    b.type = 'button'; b.className = 'cand'; b.setAttribute('aria-pressed', i === selected);
    b.innerHTML = `<span class="top"><span class="dot" style="background:${COLORS[i]}"></span><b>${km(o.total)}</b><span class="sub">km</span></span>
      ${o.type === '직접' ? '<span class="badge ok">직접 그린 코스</span>' : '<span class="badge ok">찻길 안 건넘</span>'}<span class="sub">${o.type === '왕복' ? '왕복' : '한 바퀴'} ${Math.round(o.C)}m × ${o.n}<br>약 ${fmtMin(o.total / 1000 * pace)}</span>`;
    b.onclick = () => { selected = i; draw(); };
    $('cands').appendChild(b);
  });
  const pct = v => Math.round(v * 100) + '%';
  $('detail').textContent = `한 바퀴 ${km(c.C)}km × ${c.n}바퀴` + (c.stemLen > 5 ? ` + 오가는 길 ${km(2 * c.stemLen)}km` : '') +
    ` · ${c.rev ? '반대 방향' : '기본 방향'}` + (c.type === '직접' ? ' · 직접 그린 코스는 찻길 여부를 확인 못 해요' : ` · 큰길 옆 ${pct(c.near)} · 같은 길 되밟기 ${pct(c.overlap)}`);
}
$('revBtn').onclick = () => { const c = cands[selected]; if (!c) return; c.rev = !c.rev; draw(); };
$('gpxBtn').onclick = () => {
  const c = cands[selected]; if (!c) return;
  const pts = fullRoute(c).map(p => `<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}"></trkpt>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="한바퀴 코스" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>${km(c.C)}km x ${c.n}바퀴</name><trkseg>\n${pts}\n</trkseg></trk></gpx>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = `course-${km(c.total)}km.gpx`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

// ---------- 직접 그리기 · 내 코스 ----------
function loopLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += map.distance(pts[i - 1], pts[i]); return s; }
function closeLoop(pts) { return pts.concat([pts[0]]); }
function drawnCand(pts, name) {
  if (!P0) setProj(pts[0][0], pts[0][1]);
  const lapLL = closeLoop(pts), C = loopLen(lapLL), D = parseFloat($('kmInput').value) * 1000 || C;
  const n = Math.max(1, Math.round(D / C));
  return { type: '직접', name, pts, C, n, total: n * C, stemLen: 0, overlap: 0, near: 0, lapLL, stemLL: [], rev: false, set: new Set(), overlapSet() { return 0; } };
}
function showDrawn(pts, name) {
  setProj(pts[0][0], pts[0][1]);
  all = []; cands = [drawnCand(pts, name)]; selected = 0;
  $('results').hidden = false; draw();
  const c = cands[0];
  status(`${name}: 한 바퀴 ${Math.round(c.C)}m × ${c.n}바퀴 = ${km(c.total)}km. 거리를 바꾸면 바퀴 수가 다시 계산돼요.`);
  if (matchMedia('(max-width: 819px)').matches) setCollapsed(true);
}
function updateDrawLayer() {
  drawing.layers.forEach(l => map.removeLayer(l)); drawing.layers = [];
  const p = drawing.pts;
  if (p.length > 1) drawing.layers.push(L.polyline(p, { color: COLORS[0], weight: 5 }).addTo(map));
  if (p.length > 2) drawing.layers.push(L.polyline([p[p.length - 1], p[0]], { color: COLORS[0], weight: 3, dashArray: '4 6' }).addTo(map));
  p.forEach((q, i) => drawing.layers.push(L.circleMarker(q, { radius: i ? 4 : 7, color: '#fff', weight: 2, fillColor: COLORS[0], fillOpacity: 1, interactive: false }).addTo(map)));
  const len = p.length > 2 ? loopLen(closeLoop(p)) : loopLen(p);
  $('drawTxt').innerHTML = p.length < 3 ? '달릴 길을 따라 지도를 차례로 눌러 주세요. 마지막 점은 첫 점과 자동으로 이어져요.'
    : `한 바퀴 <b>${Math.round(len)}m</b> · 점 ${p.length}개 · 모퉁이마다 눌러 주면 더 정확해요`;
  $('drawDone').disabled = p.length < 3;
}
function addDrawPoint(p) { drawing.pts.push(p); updateDrawLayer(); }
function endDraw() {
  if (!drawing) return;
  drawing.layers.forEach(l => map.removeLayer(l)); drawing = null;
  $('drawBar').hidden = true; $('panel').classList.remove('running');
  startMarker.setOpacity(1);
  setTimeout(() => map.invalidateSize(), 50);
}
$('drawBtn').onclick = () => {
  cands = []; draw(); $('results').hidden = true;
  drawing = { pts: [], layers: [] };
  $('drawBar').hidden = false; $('panel').classList.add('running'); // 조작판 숨김
  startMarker.setOpacity(0.4);
  map.setView(start, Math.max(map.getZoom(), 17));
  status('직접 그리는 중이에요.');
  setTimeout(() => map.invalidateSize(), 50);
  updateDrawLayer();
};
$('drawUndo').onclick = () => { if (drawing && drawing.pts.length) { drawing.pts.pop(); updateDrawLayer(); } };
$('drawCancel').onclick = () => { endDraw(); status(''); };
$('drawDone').onclick = () => {
  if (!drawing || drawing.pts.length < 3) return;
  const pts = drawing.pts.map(p => [Math.round(p[0] * 1e6) / 1e6, Math.round(p[1] * 1e6) / 1e6]);
  endDraw();
  const my = store.get('rc:my', []);
  const name = `내 코스 ${my.length ? Math.max(...my.map(m => m.no || 0)) + 1 : 1}`;
  my.push({ no: my.length ? Math.max(...my.map(m => m.no || 0)) + 1 : 1, name, pts, len: Math.round(loopLen(closeLoop(pts))) });
  store.set('rc:my', my.slice(-20));
  renderMy();
  showDrawn(pts, name);
};
function renderMy() {
  const my = store.get('rc:my', []), box = $('myList');
  box.innerHTML = ''; box.hidden = !my.length;
  if (!my.length) return;
  const lab = document.createElement('span'); lab.className = 'label'; lab.textContent = '내 코스'; box.appendChild(lab);
  my.forEach((m, i) => {
    const chip = document.createElement('span'); chip.className = 'mychip';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = `${m.name} · ${m.len}m`;
    b.onclick = () => { map.setView(m.pts[0], 17); showDrawn(m.pts, m.name); };
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', m.name + ' 지우기');
    x.onclick = () => {
      if (x.dataset.armed) { const arr = store.get('rc:my', []); arr.splice(i, 1); store.set('rc:my', arr); renderMy(); return; }
      x.dataset.armed = '1'; x.textContent = '지울까요?'; setTimeout(() => { if (x.isConnected) { delete x.dataset.armed; x.textContent = '×'; } }, 3000);
    };
    chip.append(b, x); box.appendChild(chip);
  });
}
renderMy();

// ---------- 달리기 모드 ----------
function resample(coords, step = 10) {
  const out = []; let prev = xy(coords[0][0], coords[0][1]), s = 0; out.push({ p: prev, s: 0 });
  for (let i = 1; i < coords.length; i++) {
    const q = xy(coords[i][0], coords[i][1]), d = dist(prev, q); if (d < 0.01) continue;
    const n = Math.ceil(d / step);
    for (let k = 1; k <= n; k++) { const t = k / n; out.push({ p: [prev[0] + (q[0] - prev[0]) * t, prev[1] + (q[1] - prev[1]) * t], s: s + d * t }); }
    s += d; prev = q;
  }
  return out;
}
let run = null, meMarker = null, accCircle = null, wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (run && document.visibilityState === 'visible') keepAwake(); });
function fmtClock(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
$('runBtn').onclick = () => {
  const c = cands[selected]; if (!c) return;
  if (!navigator.geolocation) return status('이 브라우저는 위치를 지원하지 않아요.', true);
  const R = resample(fullRoute(c));
  run = { c, R, total: R[R.length - 1].s, idx: 0, t0: Date.now(), done: 0, last: null, off: false, follow: true, finished: false,
    win: Math.max(8, Math.min(150, Math.floor(c.C / 10 * 0.6))) };
  run.watch = navigator.geolocation.watchPosition(onPos, e => setHudMsg('위치 오류: ' + e.message, 'off'), { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  run.timer = setInterval(updateHud, 1000);
  keepAwake();
  $('panel').classList.add('running'); $('hud').hidden = false; $('followBtn').hidden = true;
  status('달리는 중이에요. 화면을 켜 둔 채로 달려 주세요.');
  setTimeout(() => map.invalidateSize(), 50);
  updateHud();
};
$('stopBtn').onclick = stopRun;
function stopRun() {
  if (!run) return;
  navigator.geolocation.clearWatch(run.watch); clearInterval(run.timer);
  const sec = (Date.now() - run.t0) / 1000;
  status(`기록: ${km(run.done)}km · ${fmtClock(sec)}${run.done > 200 ? ' · 평균 ' + fmtClock(sec / (run.done / 1000)) + '/km' : ''}`);
  run = null; try { wakeLock?.release(); } catch {} wakeLock = null;
  $('panel').classList.remove('running'); $('hud').hidden = true; $('followBtn').hidden = true;
  if (meMarker) { map.removeLayer(meMarker); map.removeLayer(accCircle); meMarker = accCircle = null; }
  refit();
}
map.on('dragstart', () => { if (run) { run.follow = false; $('followBtn').hidden = false; } });
$('followBtn').onclick = () => { if (run) { run.follow = true; $('followBtn').hidden = true; if (run.lastLL) map.setView(run.lastLL, 18); } };
function setHudMsg(t, cls) { $('hudMsg').textContent = t; $('hudMsg').className = cls || ''; }
function lapNow() { const c = run.c, s = run.R[run.idx].s; return Math.min(c.n, Math.max(1, Math.floor((s - c.stemLen) / c.C) + 1)); }
function onPos(pos) {
  if (!run) return;
  const la = pos.coords.latitude, lo = pos.coords.longitude, acc = pos.coords.accuracy, P = xy(la, lo);
  run.lastLL = [la, lo];
  if (!meMarker) {
    meMarker = L.marker([la, lo], { interactive: false, icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
    accCircle = L.circle([la, lo], { radius: acc, weight: 1, color: '#1c7ed6', fillOpacity: .08 }).addTo(map);
  }
  meMarker.setLatLng([la, lo]); accCircle.setLatLng([la, lo]).setRadius(acc);
  if (run.follow) map.setView([la, lo], Math.max(map.getZoom(), 17), { animate: true });
  if (acc <= 30) { if (run.last) { const d = dist(run.last, P); if (d > 3 && d < 100) run.done += d; if (d > 3) run.last = P; } else run.last = P; }
  // 코스 위 진행 위치: 지금 위치 근처에서만 찾음 (바퀴가 겹쳐도 앞 바퀴로 건너뛰지 않게)
  const R = run.R, n = R.length, lo2 = Math.max(0, run.idx - 30), hi = Math.min(n - 1, run.idx + run.win);
  let bi = -1, bd = 1e9;
  for (let i = lo2; i <= hi; i++) { const d = dist(R[i].p, P); if (d < bd) { bd = d; bi = i; } }
  if (bd <= Math.max(30, acc)) {
    if (bi > run.idx) run.idx = bi;
    run.off = false;
    setHudMsg(acc > 40 ? `코스 위 · 위치 정확도 낮음(${Math.round(acc)}m)` : '코스 위에서 달리는 중', 'on');
  } else {
    let gd = 1e9; for (let i = 0; i < n; i += 2) gd = Math.min(gd, dist(R[i].p, P));
    if (!run.off) { run.off = true; try { navigator.vibrate?.([250, 120, 250]); } catch {} }
    setHudMsg(`코스에서 ${Math.round(gd)}m 벗어났어요`, 'off');
  }
  const lap = lapNow();
  if (run.lastLap && lap > run.lastLap) { try { navigator.vibrate?.(300); } catch {} }
  run.lastLap = lap;
  if (!run.finished && run.total - R[run.idx].s < 30 && run.idx > n * 0.8) {
    run.finished = true; try { navigator.vibrate?.([400, 150, 400, 150, 400]); } catch {}
    setHudMsg('🎉 완주! ■ 그만을 눌러 기록을 확인하세요', 'on');
  }
  updateHud();
}
function updateHud() {
  if (!run) return;
  const sec = (Date.now() - run.t0) / 1000, remain = Math.max(0, run.total - run.R[run.idx].s);
  $('hudRemain').innerHTML = `${km(remain)}<small>km 남음</small>`;
  $('hudLap').textContent = `${lapNow()}/${run.c.n}`;
  $('hudDone').textContent = km(run.done);
  $('hudTime').textContent = fmtClock(sec);
  $('hudPace').textContent = run.done > 200 ? fmtClock(sec / (run.done / 1000)) : '-';
}

schedulePrefetch();
</script>
</body>
</html>
